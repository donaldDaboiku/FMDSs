# Production-oriented Compose: app only (use managed MongoDB Atlas).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.atlas.yml up -d --build
#
# Requires in .env:
#   MONGODB_URI=mongodb+srv://...
#   JWT_SECRET=...
#   CLIENT_ORIGIN=https://your-domain.example

services:
  mongo:
    profiles: ["local-mongo"]

  app:
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your Atlas connection string}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to your public HTTPS origin}
